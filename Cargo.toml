[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NibrasAz7/warraqcraft"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde_json = "1"
# Shared Craft-family libraries (storytold/craft-libs), pinned like the
# sibling workspaces (matcraft, ProjectsCraft, reportcraft).
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df", features = ["egui"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
# Same pins as pdfcraft: print from storytold; ai from the feat/craft-ai
# fork branch until that PR lands upstream.
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "d991bf6792f8ade99c51358bf3c1d902c8cd96b5" }
craft-ai = { git = "https://github.com/NibrasAz7/craft-libs", rev = "e8ffa6fc8c4463c364ff08b415e03574602effbb" }
