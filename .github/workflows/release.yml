name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version override for a test release, for example 0.1.0-rc.1
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      WARRAQCRAFT_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libgtk-3-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "bin\tectonic.exe") {
            & .\scripts\package.ps1 -Version "$env:WARRAQCRAFT_VERSION" -IncludeTectonic
          } else {
            & .\scripts\package.ps1 -Version "$env:WARRAQCRAFT_VERSION"
          }

      - name: Build and package (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./scripts/package.sh "$WARRAQCRAFT_VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warraqcraft-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error

  release:
    name: create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
